<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blokus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --cell-size: 4.5vw; }
        @media (min-width: 600px) { :root { --cell-size: 22px; } }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(20, var(--cell-size));
            grid-template-rows: repeat(20, var(--cell-size));
            gap: 1px;
            background-color: #111827;
            touch-action: none;
            user-select: none;
        }
        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: #374151;
            border-radius: 1px;
        }
        .ghost-valid { filter: brightness(1.4) saturate(1.2); outline: 2px solid white; z-index: 10; }
        .ghost-invalid { background-color: #991b1b !important; opacity: 0.6; }
        .pending-move { filter: brightness(1.2); outline: 2px dashed rgba(255,255,255,0.5); }
        
        .piece-btn { transition: transform 0.1s; touch-action: manipulation; }
        .piece-btn:active { transform: scale(0.9); }

        #game-screen { display: none; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col items-center p-2 sm:p-4 overflow-x-hidden min-h-screen">

    <div id="setup-screen" class="w-full max-w-md flex flex-col items-center justify-center space-y-8 mt-20">
        <h1 class="text-6xl font-black text-indigo-500 tracking-tighter">BLOKUS</h1>
        <div class="w-full bg-gray-800 p-6 rounded-3xl border border-gray-700 shadow-2xl">
            <h2 class="text-xl font-bold mb-6 text-center text-gray-300">Select Players</h2>
            <div class="grid gap-4">
                <button onclick="initGame(2)" class="w-full py-4 bg-indigo-600 rounded-2xl font-bold text-lg active:scale-95">2 Players</button>
                <button onclick="initGame(3)" class="w-full py-4 bg-indigo-600 rounded-2xl font-bold text-lg active:scale-95">3 Players</button>
                <button onclick="initGame(4)" class="w-full py-4 bg-indigo-600 rounded-2xl font-bold text-lg active:scale-95">4 Players</button>
            </div>
        </div>
    </div>

    <div id="game-screen" class="w-full max-w-xl">
        <header class="flex justify-between items-center mb-4 px-2">
            <div>
                <h1 class="text-xl font-bold text-indigo-400 inline">Blokus</h1>
                <span id="player-display" class="font-black uppercase ml-3 px-3 py-1 rounded bg-gray-800 border-b-2">BLUE</span>
            </div>
            <button onclick="location.reload()" class="text-[10px] text-gray-500 border border-gray-700 px-2 py-1 rounded uppercase">Reset</button>
        </header>

        <div class="relative mb-4 flex justify-center pb-4">
            <div id="board" class="board-grid border-4 border-gray-800 shadow-2xl"></div>
        </div>

        <div class="flex items-center justify-between gap-3 mb-4 px-1">
            <div class="flex gap-2">
                <button id="rot-btn" onclick="rotatePiece()" class="w-12 h-12 bg-gray-800 hover:bg-gray
