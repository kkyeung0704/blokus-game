<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blokus - 4 Players</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .board-grid {
            display: grid;
            grid-template-columns: repeat(20, minmax(0, 1fr));
            grid-template-rows: repeat(20, minmax(0, 1fr));
            gap: 1px;
            background-color: #1f2937;
            padding: 2px;
            border-radius: 6px;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            touch-action: none; /* Prevent scrolling while dragging on the board */
        }
        .board-cell {
            background-color: #374151;
            width: 100%;
            height: 100%;
            border-radius: 2px;
            cursor: pointer;
        }
        .board-cell:hover {
            background-color: #4b5563;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center p-4 select-none">

    <header class="text-center mb-6">
        <h1 class="text-3xl font-bold text-indigo-400 mb-1">Blokus Mobile</h1>
        <p class="text-sm text-gray-400">4-Player pass-and-play.</p>
    </header>

    <div class="w-full max-w-md flex flex-col items-center gap-6">
        <div id="turn-indicator" class="w-full p-4 rounded-xl shadow-lg border text-center transition-all duration-300 bg-gray-800 border-gray-700">
            <span id="player-name" class="font-bold text-lg">Player 1 (Blue)</span>
            <span class="block text-xs text-gray-400 mt-1">Score: <span id="player-score" class="font-semibold">0</span></span>
        </div>

        <div id="board" class="board-grid shadow-2xl"></div>

        <div class="flex gap-3 w-full justify-between">
            <button id="redo-btn" onclick="redoPlacement()" class="w-1/3 py-3 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg shadow-md transition-all active:scale-95 disabled:opacity-50" disabled>
                Redo
            </button>
            <button id="confirm-btn" onclick="confirmPlacement()" class="w-1/3 py-3 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-lg shadow-md transition-all active:scale-95 disabled:opacity-50" disabled>
                Confirm
            </button>
            <button onclick="passTurn()" class="w-1/3 py-3 bg-amber-600 hover:bg-amber-700 text-white font-semibold rounded-lg shadow-md transition-all active:scale-95">
                Pass Turn
            </button>
        </div>

        <div class="w-full bg-gray-800 p-3 rounded-xl border border-gray-700 flex flex-col items-center gap-2">
            <span class="text-xs font-medium text-gray-400 tracking-wider uppercase">Selected Piece</span>
            
            <div class="flex items-center justify-between w-full px-2">
                <button onclick="rotatePiece()" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-xs rounded-lg font-medium shadow-md active:scale-95">
                    Rotate ↻
                </button>
                
                <div id="piece-preview" class="p-2 bg-gray-900 rounded-lg min-h-[60px] min-w-[60px] flex items-center justify-center cursor-grab select-none"></div>
                
                <button onclick="flipPiece()" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-xs rounded-lg font-medium shadow-md active:scale-95">
                    Flip ↔
                </button>
            </div>
        </div>

        <div class="w-full bg-gray-800 p-4 rounded-xl border border-gray-700">
            <h3 class="text-sm font-semibold mb-3 text-gray-300">Your Remaining Pieces</h3>
            <div id="pieces-container" class="flex flex-wrap gap-2 justify-center max-h-80 overflow-y-auto p-1"></div>
        </div>
    </div>
